<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">TIMDR — gałęzie, mosty i wyniki (28 września 2026)</title>
<desc id="desc">Chronoproces i cztery gałęzie TIMDR; gałęzie użyte same dają wyniki negatywne, mosty między nimi — pozytywne; zasada odniesienia z tego samego ośrodka; parametry przejść i reguła wykonalności; wyniki na łożyskach, turbinie, konstrukcjach i radarze.</desc>
<defs><style>
.bg{fill:#11131c}.formal{fill:#202a3e;stroke:#8194b7;stroke-width:3}.ms{fill:#123344;stroke:#22b9e8;stroke-width:3}
.g{fill:#2c1d46;stroke:#b175f5;stroke-width:3}.k{fill:#3c2d10;stroke:#e3ad21;stroke-width:3}.meta{fill:#12343a;stroke:#4fb3a8;stroke-width:3}
.support{fill:#143e2d;stroke:#55ca86;stroke-width:3}.partial{fill:#3c2d10;stroke:#e3ad21;stroke-width:3}.reject{fill:#4b2531;stroke:#ec687a;stroke-width:3}
.line{fill:none;stroke:#7184a4;stroke-width:3}.gline{fill:none;stroke:#55ca86;stroke-width:4}
.h{font:700 30px Arial,sans-serif;fill:#fff}.sh{font:700 21px Arial,sans-serif;fill:#fff}.small{font:17px Arial,sans-serif;fill:#c9d3e7}
.note{font:16px Arial,sans-serif;fill:#b5c1d7}.neg{font:16px Arial,sans-serif;fill:#f3a3ae}.pos{font:700 17px Arial,sans-serif;fill:#8be0ad}
.mid{font:700 17px Arial,sans-serif;fill:#f2cf6b}.label{font:700 16px Arial,sans-serif;fill:#dce6f8}
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7184a4"/></marker></defs>
<rect class="bg" width="1600" height="1480" rx="28"/>
<text x="800" y="62" text-anchor="middle" class="h">TIMDR — gałęzie, mosty i wyniki</text>
<text x="800" y="96" text-anchor="middle" class="note">Stan GIA-TIMDR: 28 września 2026. Wszystkie wyniki pre-rejestrowane, jedno uruchomienie, także negatywne.</text>
<rect x="480" y="125" width="640" height="125" rx="20" class="formal"/>
<text x="800.0" y="159" text-anchor="middle" class="sh">Chronoproces Ξ = (T, x, Γ, φ)</text>
<text x="800.0" y="189" text-anchor="middle" class="small">pierwszy trybik: wybór zegara — czas • kąt obrotu • zdarzenie</text>
<text x="800.0" y="212" text-anchor="middle" class="note">turbina: zegar kątowy AUC 1,00, zwykły czas 0,85</text>
<rect x="60" y="320" width="340" height="145" rx="20" class="ms"/>
<text x="230.0" y="354" text-anchor="middle" class="sh">M/S — sygnał</text>
<text x="230.0" y="384" text-anchor="middle" class="small">anomalia • defekt • rezonans M</text>
<text x="230.0" y="407" text-anchor="middle" class="neg">sama: operatory bez przewagi</text>
<text x="230.0" y="430" text-anchor="middle" class="note">(budynek, prądy silnika, radar)</text>
<path d="M800,250 L230.0,316" class="line" marker-end="url(#arrow)"/>
<rect x="440" y="320" width="340" height="145" rx="20" class="g"/>
<text x="610.0" y="354" text-anchor="middle" class="sh">G — geometria</text>
<text x="610.0" y="384" text-anchor="middle" class="small">rura z = x + iH[x] • krzywizna</text>
<text x="610.0" y="407" text-anchor="middle" class="neg">sama: bez zysku ponad sito</text>
<text x="610.0" y="430" text-anchor="middle" class="note">(łożyska, radar)</text>
<path d="M800,250 L610.0,316" class="line" marker-end="url(#arrow)"/>
<rect x="820" y="320" width="340" height="145" rx="20" class="k"/>
<text x="990.0" y="354" text-anchor="middle" class="sh">K — modalność</text>
<text x="990.0" y="384" text-anchor="middle" class="small">częstotliwość • faza • amplituda</text>
<text x="990.0" y="407" text-anchor="middle" class="neg">sama: samonaprawa zbędna</text>
<text x="990.0" y="430" text-anchor="middle" class="note">(przy stałej prędkości)</text>
<path d="M800,250 L990.0,316" class="line" marker-end="url(#arrow)"/>
<rect x="1200" y="320" width="340" height="145" rx="20" class="meta"/>
<text x="1370.0" y="354" text-anchor="middle" class="sh">META-DYNAMICS</text>
<text x="1370.0" y="384" text-anchor="middle" class="small">Λ • τ • ρ • J,  M = dS/dt</text>
<text x="1370.0" y="407" text-anchor="middle" class="neg">sama: ρ bez wyniku (wideo)</text>
<text x="1370.0" y="430" text-anchor="middle" class="note">teraz: ρ = D = f·τ, τ = wygaszanie</text>
<path d="M800,250 L1370.0,316" class="line" marker-end="url(#arrow)"/>
<rect x="250" y="540" width="360" height="145" rx="20" class="support"/>
<text x="430.0" y="574" text-anchor="middle" class="sh">Most: pole + sito</text>
<text x="430.0" y="604" text-anchor="middle" class="small">rezonans ustala oczka sita</text>
<text x="430.0" y="627" text-anchor="middle" class="pos">SUPPORTED — łożyska Paderborn</text>
<text x="430.0" y="650" text-anchor="middle" class="note">3 próby, +0,08 vs klasyka (12/15 foldów)</text>
<path d="M230.0,465 L320,536" class="gline" marker-end="url(#arrow)"/>
<path d="M610.0,465 L540,536" class="gline" marker-end="url(#arrow)"/>
<rect x="620" y="540" width="360" height="145" rx="20" class="support"/>
<text x="800.0" y="574" text-anchor="middle" class="sh">Most: kotwica K → sito</text>
<text x="800.0" y="604" text-anchor="middle" class="small">+ prostowanie rury (zegar kątowy)</text>
<text x="800.0" y="627" text-anchor="middle" class="pos">SUPPORTED — turbina wiatrowa</text>
<text x="800.0" y="650" text-anchor="middle" class="note">AUC 1,00, swoistość 1,00</text>
<path d="M610.0,465 L690,536" class="gline" marker-end="url(#arrow)"/>
<path d="M990.0,465 L910,536" class="gline" marker-end="url(#arrow)"/>
<rect x="990" y="540" width="360" height="145" rx="20" class="support"/>
<text x="1170.0" y="574" text-anchor="middle" class="sh">Most: reżim D = f·τ</text>
<text x="1170.0" y="604" text-anchor="middle" class="small">cząsteczka ↔ pakiet ↔ fala</text>
<text x="1170.0" y="627" text-anchor="middle" class="pos">SUPPORTED — łożyska do zniszczenia</text>
<text x="1170.0" y="650" text-anchor="middle" class="note">PRONOSTIA 9/11 + 7/11; budynek ρ +0,98</text>
<path d="M990.0,465 L1060,536" class="gline" marker-end="url(#arrow)"/>
<path d="M1370.0,465 L1280,536" class="gline" marker-end="url(#arrow)"/>
<rect x="60" y="760" width="355" height="140" rx="20" class="partial"/>
<text x="237.5" y="794" text-anchor="middle" class="sh">Konstrukcje: kotwica modalna</text>
<text x="237.5" y="824" text-anchor="middle" class="pos">tak: most KW51 • rama LANL</text>
<text x="237.5" y="847" text-anchor="middle" class="pos">tak: śruba ORION-AE (trend)</text>
<text x="237.5" y="870" text-anchor="middle" class="neg">nie: Hell Bridge, sama kotwica</text>
<rect x="437" y="760" width="355" height="140" rx="20" class="partial"/>
<text x="614.5" y="794" text-anchor="middle" class="sh">Zwinięcie pola w rurę</text>
<text x="614.5" y="824" text-anchor="middle" class="mid">rura niesie informację</text>
<text x="614.5" y="847" text-anchor="middle" class="note">radar: 0,76 — tyle co sito</text>
<text x="614.5" y="870" text-anchor="middle" class="neg">bez zysku ponad klasykę</text>
<rect x="814" y="760" width="355" height="140" rx="20" class="partial"/>
<text x="991.5" y="794" text-anchor="middle" class="sh">Radar: lustro i cień</text>
<text x="991.5" y="824" text-anchor="middle" class="pos">mmWave 16 s: stereoskopia 3/3</text>
<text x="991.5" y="847" text-anchor="middle" class="mid">lustro 0,89 vs klasyka 0,81 (most MIXED)</text>
<text x="991.5" y="870" text-anchor="middle" class="neg">nie: Open Radar — za krótkie ślady</text>
<rect x="1191" y="760" width="355" height="140" rx="20" class="partial"/>
<text x="1368.5" y="794" text-anchor="middle" class="sh">K → G → M/S: przerwa ciągłości</text>
<text x="1368.5" y="824" text-anchor="middle" class="pos">HBTA pionowe 0,93–0,94 ≥ AR</text>
<text x="1368.5" y="847" text-anchor="middle" class="mid">średnio remis z AR 0,80 (stężenia)</text>
<text x="1368.5" y="870" text-anchor="middle" class="neg">nie: antyrezonanse surowe, Möbius</text>
<rect x="60" y="920" width="880" height="150" rx="20" class="formal"/>
<text x="500.0" y="954" text-anchor="middle" class="sh">Zasada odniesienia — wzór wszystkich udanych mostów</text>
<text x="500.0" y="984" text-anchor="middle" class="small">nałóż sygnał na odniesienie z tego samego ośrodka, znieś to, co wspólne, czytaj resztę</text>
<text x="500.0" y="1007" text-anchor="middle" class="note">sito • zegar kątowy • kotwica • faza wzbudnika • lustro (cień) • stosunki częstotliwości</text>
<text x="500.0" y="1030" text-anchor="middle" class="note">porażka = zakłócenie bez odniesienia (temperatura, za krótkie okno, nierówne skalowanie)</text>
<rect x="960" y="920" width="586" height="150" rx="20" class="partial"/>
<text x="1253.0" y="954" text-anchor="middle" class="sh">Stosunki częstotliwości (odniesienie ze stali)</text>
<text x="1253.0" y="984" text-anchor="middle" class="pos">tak: KW51, 15 miesięcy — lepiej niż termometr (5/6)</text>
<text x="1253.0" y="1007" text-anchor="middle" class="pos">tak: Hell Bridge P1 — antyrezonanse 0/8 → 7/8</text>
<text x="1253.0" y="1030" text-anchor="middle" class="neg">nie: LUMO, Hell Bridge P2 — nierówne skalowanie</text>
<rect x="60" y="1105" width="1486" height="140" rx="20" class="formal"/>
<text x="803.0" y="1139" text-anchor="middle" class="sh">Parametry przejść — reguła wykonalności liczona PRZED testem</text>
<text x="803.0" y="1169" text-anchor="middle" class="small">N_cyk ≥ 10 (także na danych testowych) • kotwica (stała / śledzona / wolna) • D = f·τ • L_koh • koherencja γ² ≥ 0,8 • znaki ρ(f, T) przed stosunkami</text>
<text x="803.0" y="1192" text-anchor="middle" class="note">Trafne przewidywania: słabe sito na PRONOSTIA; wolna kotwica = porażka (radar); reżim fali → linie K; LUMO: różne znaki ρ → stosunki nie pomogą</text>
<text x="803.0" y="1215" text-anchor="middle" class="note">Każdy krok porównywany ze znanym odpowiednikiem: widmo obwiedni, kurtogram, order tracking, OMA/SSI, AR, CVD, regresja temperaturowa</text>
<text x="800" y="1285" text-anchor="middle" class="label">Obserwacja: gałąź sama — wynik negatywny; most — pozytywny, gdy pierwszy trybik (rytm w oknie) jest spełniony, a zakłócenie ma odniesienie.</text>
<rect x="150" y="1320" width="34" height="22" rx="5" class="support"/>
<text x="196" y="1337" class="small">potwierdzony (pre-rejestracja)</text>
<rect x="490" y="1320" width="34" height="22" rx="5" class="partial"/>
<text x="536" y="1337" class="small">częściowy / mieszany</text>
<rect x="830" y="1320" width="34" height="22" rx="5" class="reject"/>
<text x="876" y="1337" class="small">odrzucony</text>
<rect x="1170" y="1320" width="34" height="22" rx="5" class="formal"/>
<text x="1216" y="1337" class="small">komponent formalny</text>
<text x="800" y="1395" text-anchor="middle" class="note">Szczegóły i liczby: README GIA-TIMDR (tabela wyników), docs/geometry/RESULT_*.md; narzędzia: Industrial-Predict, Structural-Health, Modal-Formalism, META-DYNAMICS.</text>
<text x="800" y="1425" text-anchor="middle" class="note">TIMDR to model do budowania programów analizujących sygnały — rama, drogowskazy i protokół, nie gotowy detektor.</text>
</svg>